# Copie este arquivo para %USERPROFILE%\.eproc-mcp\config.toml (Windows)
# ou ~/.eproc-mcp/config.toml (Linux e macOS) e ajuste os valores.
# Campo omitido assume o valor padrão de eproc_mcp/config.py.

# Endereço do eproc de 1º grau do TJSC. Confira na barra do navegador.
url_base = "https://eproc1g.tjsc.jus.br/eproc/"

# "msedge" ou "chrome" usam o navegador instalado, o que ajuda no login com certificado.
# Deixe vazio para usar o Chromium do Playwright (exige "playwright install chromium").
canal_navegador = "msedge"
headless = false

# Ritmo e limites
intervalo_entre_paginas_s = 1.5
max_processos_por_coleta = 50
max_paginas_por_lista = 10
max_caracteres_documento = 20000

# Localizadores autorizados. Lista vazia libera todos.
# Exemplo, localizadores_permitidos = ["GAB - Decisão Urgente", "GAB - Sentença"]
localizadores_permitidos = []

# bloquear, metadados ou livre
politica_sigilo = "metadados"

# Nomes das partes vão ao modelo em processos sem sigilo?
incluir_partes = false

# Pasta onde as planilhas de triagem são gravadas
# pasta_saida = "C:/Users/SEU_USUARIO/Documents/triagens"

# Ajustes finos de tela, preenchidos depois do diagnóstico
# seletor_proxima_pagina = "#lnkInfraProximaPaginaSuperior"
# seletor_pesquisa_rapida = "#txtNumProcessoPesquisaRapida"

# Termos extras que bloqueiam requisições, somados à lista padrão
# acoes_bloqueadas_extras = ["redistribuicao"]

# Marcadores próprios ou substitutos, em minúsculas e sem acento
# [marcadores]
# superendividamento = ["superendividamento", "lei 14.181"]
