[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eproc-mcp"
version = "0.1.0"
description = "MCP somente leitura para triagem de processos conclusos no eproc"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "playwright>=1.45",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
teste = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
eproc-mcp = "eproc_mcp.server:main"

[tool.setuptools]
packages = ["eproc_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
